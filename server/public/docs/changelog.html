<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Change Log - Inferno Map Room 2</title>
  <meta name="description" content="Every change made to Inferno Map Room 2, day by day, newest first.">
  <meta name="theme-color" content="#1a0503">
  <meta name="color-scheme" content="dark">
  <!-- QoL #649: the game's Change Log as a page. It reads /changelog (server/src/controllers/changelog.ts, which is
       public/docs/changelog.json), so it is always the game's own. Its style is faq.html's: keep the pages the same.
       An item with `later` (a later change undid or changed it) says so under it, with a link to that day.
       22 October: easier to read, as the game's window (IoChangelog.ts): Show (New for you, Recent, Everything),
       the topics (the server's `topics`) each with its count, Titles only, and the days fold. What is new is kept
       in this browser (localStorage "ioClSeen": the newest day seen and its changes, hashed as UI_TOP.ioClId).
       The choices are in the address (?view=all&topic=yard&q=...&brief=1), so a link shows the same. -->
  <style>
    @font-face { font-family: "Groboldov"; src: url("/web/fonts/groboldov.woff") format("woff"); font-display: swap; }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; min-height: 100vh; color: #f2dcc8; font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(ellipse at 50% -10%, rgba(255, 90, 20, .24), transparent 65%), #0d0403; }
    .page { max-width: 760px; margin: 0 auto; padding: 20px 16px 40px; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; }
    .top .home { font: 400 17px "Groboldov", Impact, sans-serif; color: #ffd8b0; text-decoration: none; text-shadow: 0 2px 0 #2d0602; }
    h1 { margin: 22px 0 6px; font: 400 clamp(28px, 6vw, 42px)/1.1 "Groboldov", Impact, sans-serif; letter-spacing: .3px;
      background: linear-gradient(#ffe9a0, #ff9a3a 55%, #e0401a); -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 2px 0 #2d0602); }
    p { margin: 0 0 12px; }
    a { color: #ffc27a; }
    a:hover { color: #ffe9a0; }
    button { font: inherit; color: inherit; }
    .lead { color: #e8c9ad; margin-bottom: 10px; }
    .note { font-size: 14px; color: #c9a98f; }

    /* the choices: Show and the topics stay at the top while the list scrolls */
    .bar { position: sticky; top: 0; z-index: 5; margin: 0 -16px; padding: 10px 16px 8px; background: rgba(13, 4, 3, .94);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border-bottom: 1px solid #4a1a0c; }
    .views { display: flex; gap: 0; border: 1px solid #6a2410; border-radius: 10px; overflow: hidden; }
    .views button { flex: 1 1 0; min-width: 0; min-height: 40px; padding: 6px 8px; border: 0; border-left: 1px solid #6a2410; background: #200a06;
      font-weight: 600; font-size: 15px; color: #e8c9ad; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
    .views button:first-child { border-left: 0; }
    .views button[aria-pressed="true"] { background: linear-gradient(#e08a30, #9a3010); color: #fff; }
    .views .n { font-size: 13px; font-weight: 600; opacity: .8; }
    .views .hot { opacity: 1; min-width: 22px; padding: 0 6px; border-radius: 11px; background: #c0201a; color: #fff; border: 1px solid #ffe6a0; line-height: 18px; }
    .topics { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 4px 12px; border-radius: 17px; border: 1px solid #6a2410;
      background: #2a0d08; font-size: 14px; font-weight: 600; color: #f2dcc8; cursor: pointer; white-space: nowrap; }
    .chip .n { font-weight: 500; color: #c9a98f; font-size: 13px; }
    .chip[aria-pressed="true"] { background: #ffb36b; border-color: #ffe0a0; color: #1a0503; }
    .chip[aria-pressed="true"] .n { color: #4a1a0c; }
    .chip.zero { opacity: .45; }
    .chip.area { background: #3a1408; border-style: dashed; }
    .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 12px 0 4px; }
    .tools input[type=search] { flex: 1 1 220px; min-width: 0; min-height: 40px; padding: 8px 10px; border-radius: 8px; border: 1px solid #6a2410;
      background: #2a0d08; color: #f2dcc8; font: inherit; }
    .switch { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; font-size: 15px; cursor: pointer; user-select: none; }
    .switch input { width: 20px; height: 20px; accent-color: #e08a30; margin: 0; }
    .status { margin: 10px 0 0; font-size: 14px; color: #c9a98f; }

    /* the days, each folding */
    .day { margin: 12px 0 0; }
    .dayhead { display: grid; grid-template-columns: 18px 1fr auto; align-items: baseline; gap: 2px 8px; width: 100%; text-align: left; cursor: pointer;
      padding: 10px 12px; border: 1px solid #6a2410; border-radius: 10px; background: rgba(40, 8, 4, .72); scroll-margin-top: 150px; }
    .dayhead[aria-expanded="true"] { border-color: #c8501a; background: rgba(58, 26, 16, .9); border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
    .dayhead .arrow { color: #ffb36b; transition: transform .15s; display: inline-block; }
    .dayhead[aria-expanded="true"] .arrow { transform: rotate(90deg); }
    .dayhead .when { font: 400 19px/1.2 "Groboldov", Impact, sans-serif; color: #ffb36b; text-shadow: 0 2px 0 #2d0602; }
    .dayhead .count { font-size: 13px; color: #c9a98f; white-space: nowrap; }
    .dayhead .headline { grid-column: 2 / 4; font-size: 14px; color: #c9a98f; line-height: 1.4; }
    .dayhead[aria-expanded="false"] .headline { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card { background: rgba(40, 8, 4, .72); border: 1px solid #6a2410; border-top: 0; border-radius: 0 0 10px 10px; padding: 2px 16px; }
    .item { padding: 10px 0; border-top: 1px solid rgba(106, 36, 16, .7); }
    .item:first-child { border-top: 0; }
    .item h3 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 0 0 4px; font-size: 16px; line-height: 1.35; color: #ffd8b0; }
    .tag { display: inline-block; padding: 1px 8px; border: 0; border-radius: 9px; font-size: 12px; font-weight: 600; color: #1a0503; background: #b8a898; cursor: pointer; line-height: 1.5; }
    .new { display: inline-block; padding: 0 7px; border-radius: 9px; font-size: 11px; font-weight: 700; letter-spacing: .4px; color: #fff; background: #c0201a; line-height: 1.6; }
    .item p { margin: 0; font-size: 15px; }
    .later { margin-top: 4px; font-size: 14px; color: #ffb36b; }
    /* Titles only: a change is one line, a tap shows what it means */
    .brief .item { padding: 6px 0; }
    .brief .item h3 { margin: 0; flex-wrap: nowrap; }
    .brief .item .t { flex: 1; min-width: 0; }
    .open { flex: none; margin-left: auto; width: 32px; height: 28px; border: 1px solid #6a2410; border-radius: 6px; background: #2a0d08; color: #ffb36b; font-weight: 700; cursor: pointer; }
    .brief .item h3 .t { cursor: pointer; }
    .more { display: block; width: 100%; margin: 6px 0 10px; min-height: 40px; border: 1px dashed #6a2410; border-radius: 8px; background: transparent; color: #ffc27a; cursor: pointer; font-size: 14px; }
    footer { margin-top: 36px; padding-top: 14px; border-top: 1px solid #6a2410; font-size: 14px; color: #c9a98f; }
    footer nav { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-bottom: 8px; }
    footer a[aria-current] { color: #f2dcc8; font-weight: 600; text-decoration: none; }
    .totop { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); width: 46px; height: 46px; border-radius: 23px; border: 1px solid #c8501a;
      background: rgba(58, 26, 16, .95); color: #ffd8b0; font-size: 20px; cursor: pointer; display: none; box-shadow: 0 4px 14px rgba(0, 0, 0, .5); }
    .totop.show { display: block; }
    /* a phone: the topics in one line that scrolls sideways, larger targets */
    @media (max-width: 560px) {
      .topics { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; margin-right: -16px; padding-right: 16px;
        -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); mask-image: linear-gradient(90deg, #000 85%, transparent); }
      .topics::-webkit-scrollbar { display: none; }
      .chip { min-height: 38px; }
      .views button { font-size: 14px; padding: 6px 4px; }
      .card { padding: 2px 13px; }
      .dayhead { padding: 10px; }
      .dayhead .when { font-size: 17px; }
    }
    @media (max-width: 400px) { .views button { font-size: 13px; gap: 4px; } .views .n { font-size: 12px; } }
    /* a small phone: Show's counts but New's red one left out, so the three fit */
    @media (max-width: 350px) { .views .n:not(.hot) { display: none; } }
    @media (prefers-reduced-motion: reduce) { .dayhead .arrow { transition: none; } }
  </style>
</head>
<body>
  <div class="page">
    <header class="top">
      <a class="home" href="/">Inferno Map Room 2</a>
      <a href="/">Back to the game</a>
    </header>
    <main>
      <h1>Change Log</h1>
      <p class="lead" id="summary">Every change made to the Inferno, day by day, newest first.</p>
      <div class="bar" id="bar">
        <div class="views" role="group" aria-label="Show">
          <button type="button" data-view="new" aria-pressed="false">New for you <span class="n"></span></button>
          <button type="button" data-view="recent" aria-pressed="false">Recent <span class="n"></span></button>
          <button type="button" data-view="all" aria-pressed="false">Everything <span class="n"></span></button>
        </div>
        <div class="topics" id="topics" role="group" aria-label="Topics"></div>
      </div>
      <div class="tools">
        <input id="find" type="search" placeholder="Find a change" aria-label="Find a change" enterkeyhint="search">
        <label class="switch"><input id="brief" type="checkbox"> Titles only</label>
      </div>
      <p class="status" id="status" aria-live="polite"></p>
      <div id="days"><p class="note">Loading...</p></div>
    </main>
    <footer>
      <nav aria-label="Help pages">
        <a href="/faq">FAQ</a>
        <a href="/shiny">Shiny</a>
        <a href="/schedule">When things happen</a>
        <a href="/changes" aria-current="page">Change Log</a>
        <a href="/guide">Player guide</a>
        <a href="/rules">Rules</a>
        <a href="/">Play</a>
      </nav>
      <p>Inferno Map Room 2, a Backyard Monsters Refitted server.</p>
    </footer>
  </div>
  <button type="button" class="totop" id="totop" aria-label="Back to the top">&#8593;</button>
  <script>
    (function () {
      // the area tags' colours, as the game's Change Log (IoChangelog.AREAS)
      var AREAS = { "Yard": "#6AB04A", "Map": "#4A8AD0", "Depths": "#B070F0", "Battles": "#E0503A", "Monsters": "#E08A3A", "Buildings": "#C8A050", "Economy": "#E0C040", "Events": "#FF7A2A", "Quests": "#50B0A0", "Alliances": "#5A9AE0", "Chat": "#80C0E0", "Leaderboards": "#D0B060", "Brimstone Pit": "#D06A90", "Pets": "#A0D070", "Replays": "#9A9AE0", "Interface": "#B8A898", "Browser": "#70B8B0", "Admins": "#9A7AC0", "Fixes": "#8A9A8A", "Hellgate": "#D2462A", "Arcade": "#FF3A7A", "Outposts": "#7AA0C8", "Signing in": "#C8B060", "Server": "#8AA0B0", "D.A.V.E. Club": "#E0A0D0" };
      var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      var DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
      var RECENT_DAYS = 7; // (IoChangelog.RECENT_DAYS)
      var PAGE = 40; // a long day shows this many changes, then "Show all"
      var box = document.getElementById("days");
      var find = document.getElementById("find");
      var briefBox = document.getElementById("brief");
      var statusLine = document.getElementById("status");
      var topicsBox = document.getElementById("topics");
      var viewButtons = Array.prototype.slice.call(document.querySelectorAll(".views button"));
      var data = null, topics = [];
      var fresh = {}, freshN = 0;
      var state = { view: "", topic: "", area: "", q: "", brief: false };
      var dayOpen = {}, itemOpen = {}, dayAll = {};

      function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
      function parts(iso) { var p = String(iso).split("-"); return p.length === 3 ? { y: +p[0], m: +p[1] - 1, d: +p[2] } : null; }
      function dayName(iso) { var p = parts(iso); if (!p || p.m < 0 || p.m > 11) return String(iso); return DAYS[new Date(p.y, p.m, p.d).getDay()] + " " + p.d + " " + MONTHS[p.m] + " " + p.y; }
      function shortDay(iso) { var p = parts(iso); if (!p || p.m < 0 || p.m > 11) return String(iso); return p.d + " " + MONTHS[p.m].substr(0, 3); }
      function plural(n, one, many) { return n === 1 ? "1 " + one : n.toLocaleString("en") + " " + many; }
      function store(get, key, value) {
        try { if (get) return window.localStorage.getItem(key); window.localStorage.setItem(key, value); } catch (e) {}
        return null;
      }
      // a change's short name, as the game's (UI_TOP.ioClId): its area and title, hashed
      function idOf(item) {
        var s = String(item.area || "") + "|" + String(item.title || ""), h = 5381;
        for (var i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
        return h.toString(36);
      }
      function keyOf(date, item) { return date + ":" + idOf(item); }

      // ---- what is new in this browser: every change after the newest day seen, and that day's not in its list
      function workOutFresh(entries) {
        var keep = null;
        try { keep = JSON.parse(window.sessionStorage.getItem("ioClFresh") || "null"); } catch (e) {}
        var mark = null;
        try { mark = JSON.parse(store(true, "ioClSeen") || "null"); } catch (e) {}
        fresh = keep && typeof keep === "object" ? keep : {};
        if (mark && mark.date) {
          var seen = {};
          (mark.ids || []).forEach(function (i) { seen[i] = true; });
          entries.forEach(function (e) {
            if (String(e.date) < mark.date) return;
            (e.items || []).forEach(function (it) {
              if (String(e.date) > mark.date || !seen[idOf(it)]) fresh[keyOf(e.date, it)] = true;
            });
          });
        }
        // (seen now; still new on a reload of this tab)
        if (entries.length) store(false, "ioClSeen", JSON.stringify({ date: entries[0].date, ids: (entries[0].items || []).map(idOf) }));
        try { window.sessionStorage.setItem("ioClFresh", JSON.stringify(fresh)); } catch (e) {}
        freshN = 0;
        entries.forEach(function (e) { (e.items || []).forEach(function (it) { if (fresh[keyOf(e.date, it)]) freshN++; }); });
      }

      function inView(entries, view) {
        if (view === "recent") return entries.slice(0, RECENT_DAYS);
        if (view !== "new") return entries;
        var out = [];
        entries.forEach(function (e) {
          var its = (e.items || []).filter(function (it) { return fresh[keyOf(e.date, it)]; });
          if (its.length) out.push({ date: e.date, headline: e.headline, items: its });
        });
        return out;
      }
      function areasOf(id) {
        for (var i = 0; i < topics.length; i++) if (topics[i].id === id) { var o = {}; (topics[i].areas || []).forEach(function (a) { o[a] = true; }); return o; }
        return null;
      }
      function topicName(id) { for (var i = 0; i < topics.length; i++) if (topics[i].id === id) return topics[i].name; return ""; }
      function matches(item, words, area, areas) {
        if (area && item.area !== area) return false;
        if (areas && !areas[item.area]) return false;
        if (!words.length) return true;
        var all = (String(item.area || "") + " " + String(item.title || "") + " " + String(item.text || "")).toLowerCase();
        return words.every(function (w) { return all.indexOf(w) >= 0; });
      }
      function filter(entries, words, area, areas) {
        var out = [];
        entries.forEach(function (e) {
          var its = (e.items || []).filter(function (it) { return matches(it, words, area, areas); });
          if (its.length) out.push({ date: e.date, headline: e.headline, items: its });
        });
        return out;
      }
      function count(entries) { var n = 0; entries.forEach(function (e) { n += e.items.length; }); return n; }

      // ---- the choices in the address, so a link (or the game's "Open as a page") shows the same
      function readAddress() {
        var q = new URLSearchParams(location.search);
        if (q.get("view") && /^(new|recent|all)$/.test(q.get("view"))) state.view = q.get("view");
        state.topic = q.has("topic") ? String(q.get("topic") || "") : String(store(true, "ioClTopic") || "");
        state.q = String(q.get("q") || "");
        state.area = String(q.get("area") || "");
        state.brief = q.has("brief") ? q.get("brief") === "1" : store(true, "ioClBrief") === "1";
        find.value = state.q;
        briefBox.checked = state.brief;
      }
      function writeAddress() {
        var q = new URLSearchParams();
        var v = new URLSearchParams(location.search).get("v"); // (the server's, so a reload is this copy)
        if (v) q.set("v", v);
        if (state.view) q.set("view", state.view);
        if (state.topic) q.set("topic", state.topic);
        if (state.area) q.set("area", state.area);
        if (state.q) q.set("q", state.q);
        if (state.brief) q.set("brief", "1");
        var s = q.toString();
        try { history.replaceState(null, "", location.pathname + (s ? "?" + s : "") + location.hash); } catch (e) {}
      }

      function setView(v) { if (state.view !== v) { dayOpen = {}; dayAll = {}; } state.view = v; writeAddress(); render(); }
      function setTopic(t) { state.topic = t; state.area = ""; store(false, "ioClTopic", t); writeAddress(); render(); }
      function setArea(a) { state.area = state.area === a ? "" : a; writeAddress(); render(); }

      function chip(label, n, on, onClick, cls) {
        var b = el("button", "chip" + (cls ? " " + cls : "") + (n === 0 && !on ? " zero" : ""));
        b.type = "button";
        b.setAttribute("aria-pressed", on ? "true" : "false");
        b.appendChild(document.createTextNode(label));
        if (n != null) b.appendChild(el("span", "n", n.toLocaleString("en")));
        b.addEventListener("click", onClick);
        return b;
      }

      function render() {
        if (!data) return;
        var words = state.q.toLowerCase().split(/\s+/).filter(Boolean);
        var entries = Array.isArray(data.entries) ? data.entries : [];
        if (!state.view) state.view = freshN > 0 ? "new" : "recent";
        if (state.topic && !areasOf(state.topic)) state.topic = "";
        var areas = areasOf(state.topic);
        // Show: each with how many changes it has in the topic and search chosen
        viewButtons.forEach(function (b) {
          var v = b.getAttribute("data-view"), n = count(filter(inView(entries, v), words, state.area, areas));
          b.setAttribute("aria-pressed", state.view === v ? "true" : "false");
          var span = b.querySelector(".n");
          span.textContent = n.toLocaleString("en");
          span.className = "n" + (v === "new" && n > 0 ? " hot" : "");
        });
        // the topics: each with how many changes it has in what is shown
        var shownAll = inView(entries, state.view);
        topicsBox.textContent = "";
        topicsBox.appendChild(chip("All topics", count(filter(shownAll, words, "", null)), !state.topic && !state.area, function () { setTopic(""); }));
        topics.forEach(function (t) {
          topicsBox.appendChild(chip(t.name, count(filter(shownAll, words, "", areasOf(t.id))), state.topic === t.id && !state.area, function () { setTopic(t.id); }));
        });
        if (state.area) topicsBox.appendChild(chip(state.area + " ×", null, true, function () { setArea(state.area); }, "area"));
        var total = count(shownAll);
        var shown = filter(shownAll, words, state.area, areas);
        var found = count(shown);
        // what is shown, in words
        var what = state.view === "new" ? plural(found, "new change", "new changes") + " since you last looked"
          : state.view === "recent" ? plural(found, "change", "changes") + " over the latest " + Math.min(RECENT_DAYS, entries.length) + " days"
          : plural(found, "change", "changes") + " over " + plural(shown.length, "day", "days");
        if (words.length || state.area || areas) what = found.toLocaleString("en") + " of " + plural(total, "change", "changes") + (state.area ? " in " + state.area : areas ? " in " + topicName(state.topic) : "") + (words.length ? " matching “" + state.q + "”" : "");
        statusLine.textContent = what + ".";
        box.textContent = "";
        box.className = state.brief ? "brief" : "";
        if (!shown.length) {
          box.appendChild(el("p", "note", state.view === "new" && !words.length && !state.area && !areas ? "Nothing new since you last looked. Recent shows the latest days." : "No change matches that."));
          return;
        }
        shown.forEach(function (e, i) {
          var open = dayOpen[e.date] != null ? dayOpen[e.date] : (state.view !== "all" || words.length > 0 || !!state.area || i === 0);
          var sec = el("section", "day");
          var head = el("button", "dayhead");
          head.type = "button";
          head.id = "d-" + e.date;
          head.setAttribute("aria-expanded", open ? "true" : "false");
          head.appendChild(el("span", "arrow", "▸"));
          head.appendChild(el("span", "when", dayName(e.date)));
          head.appendChild(el("span", "count", plural(e.items.length, "change", "changes")));
          if (e.headline) head.appendChild(el("span", "headline", e.headline));
          head.addEventListener("click", function () { dayOpen[e.date] = !open; render(); });
          sec.appendChild(head);
          if (open) {
            var card = el("div", "card");
            var list = dayAll[e.date] ? e.items : e.items.slice(0, PAGE);
            list.forEach(function (it) { card.appendChild(itemRow(e.date, it)); });
            sec.appendChild(card);
            if (list.length < e.items.length) {
              var more = el("button", "more", "Show all " + e.items.length + " changes of this day");
              more.type = "button";
              more.addEventListener("click", function () { dayAll[e.date] = true; render(); });
              sec.appendChild(more);
            }
          }
          box.appendChild(sec);
        });
      }

      function itemRow(date, it) {
        var key = keyOf(date, it);
        var row = el("div", "item");
        var head = el("h3");
        var tag = el("button", "tag", it.area || "");
        tag.type = "button";
        tag.title = "Only " + (it.area || "") + " (again: all)";
        tag.style.background = AREAS[it.area] || "#B8A898";
        tag.addEventListener("click", function () { setArea(it.area || ""); });
        head.appendChild(tag);
        var title = el("span", "t", String(it.title || ""));
        head.appendChild(title);
        if (state.view !== "new" && fresh[key]) head.appendChild(el("span", "new", "NEW"));
        var opened = !state.brief || !!itemOpen[key];
        if (state.brief) {
          var btn = el("button", "open", opened ? "−" : "+");
          btn.type = "button";
          btn.setAttribute("aria-expanded", opened ? "true" : "false");
          btn.setAttribute("aria-label", (opened ? "Hide" : "Show") + " what it means");
          var flip = function () { itemOpen[key] = !itemOpen[key]; render(); };
          btn.addEventListener("click", flip);
          title.addEventListener("click", flip);
          head.appendChild(btn);
        }
        row.appendChild(head);
        if (!opened) return row;
        row.appendChild(el("p", null, String(it.text || "")));
        // (QoL #649: undone or changed by a later change: which day, and a few words if the file has them)
        var later = it.later && typeof it.later === "object" ? it.later : (it.later ? { date: String(it.later) } : null);
        if (later && later.date) {
          var line = el("div", "later", "Changed later, see ");
          var a = el("a", null, shortDay(later.date));
          a.href = "#d-" + later.date;
          a.addEventListener("click", function (ev) { ev.preventDefault(); goToDay(later.date); });
          line.appendChild(a);
          if (later.note) line.appendChild(document.createTextNode(": " + String(later.note)));
          row.appendChild(line);
        }
        return row;
      }

      // a day by its date: Everything, every topic, that day open
      function goToDay(date) {
        state.view = "all"; state.topic = ""; state.area = ""; state.q = ""; find.value = "";
        dayOpen = {}; dayOpen[date] = true;
        writeAddress(); render();
        try { history.replaceState(null, "", location.pathname + location.search + "#d-" + date); } catch (e) {}
        var t = document.getElementById("d-" + date);
        if (t) t.scrollIntoView();
      }

      readAddress();
      viewButtons.forEach(function (b) { b.addEventListener("click", function () { setView(b.getAttribute("data-view")); }); });
      var wait = 0;
      find.addEventListener("input", function () { clearTimeout(wait); wait = setTimeout(function () { state.q = find.value.trim(); writeAddress(); render(); }, 200); });
      briefBox.addEventListener("change", function () { state.brief = briefBox.checked; store(false, "ioClBrief", state.brief ? "1" : "0"); writeAddress(); render(); });
      var toTop = document.getElementById("totop");
      window.addEventListener("scroll", function () { toTop.className = "totop" + (window.scrollY > 900 ? " show" : ""); }, { passive: true });
      toTop.addEventListener("click", function () { window.scrollTo({ top: 0, behavior: "smooth" }); });

      fetch("/changelog", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (j) {
        if (!j || j.error) throw new Error(String(j && j.error));
        data = j;
        data.entries = Array.isArray(j.entries) ? j.entries : [];
        data.entries.forEach(function (e) { e.items = Array.isArray(e.items) ? e.items : []; });
        topics = Array.isArray(j.topics) ? j.topics : [];
        workOutFresh(data.entries);
        var n = count(data.entries);
        document.getElementById("summary").textContent = n.toLocaleString("en") + " changes over " + data.entries.length + " days, newest first. Updated " + dayName(j.updated || (data.entries[0] || {}).date || "") + ".";
        var m = /^#d-(\d{4}-\d\d-\d\d)$/.exec(location.hash);
        if (m) goToDay(m[1]); else render();
      }).catch(function () {
        box.textContent = "";
        box.appendChild(el("p", "note", "The Change Log couldn't be loaded. Try again in a moment."));
      });
    })();
  </script>
</body>
</html>
