services:
  web:
    ports:
      - "80:3001"
      - "${CHAT_WS_PORT:-3010}:3010"
      - "843:843"
    environment:
      - ENV=production

  # Don't expose db or redis ports to the host in production. (`!reset` empties the list: a plain `[]` is
  # merged with the base file's ports, so it removed nothing. Compose 2.18 or newer.)
  db:
    ports: !reset []

  redis:
    ports: !reset []
