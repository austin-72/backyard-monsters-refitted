name: bymr

volumes:
  db:
  pgadmin:
  # (14 October, QoL #272: Redis keeps mutes, chat bans, maintenance mode, the announcement and Global chat
  # history; with its own volume and an append-only file they survive the container being re-created)
  redis:


networks:
  bymr:


services:
  # Database initialization service (runs once, then exits)
  db-init:
    build: .
    environment:
      - DB_NAME=${DB_NAME:-bym}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-dev12345}
    networks:
      - bymr
    depends_on:
      db:
        condition: service_healthy
    command: bun run db:init
    restart: "no"

  # API server
  web:
    build: .
    container_name: bymr-api-server
    restart: unless-stopped
    # (14 October, QoL #7: the rest of .env reaches the server too: SESSION_LIFETIME, SESSION_BIND_DEVICE,
    # SAVED_LOGIN_DAYS, DB_POOL_MAX, COMPRESS_REPLIES, SMTP_*, ... The list below still wins for the keys it
    # names, so DB_HOST and REDIS_URL point inside Docker whatever .env says.)
    env_file:
      - path: .env
        required: false
    environment:
      - ENV=${ENV:-local}
      - BASE_URL=${BASE_URL:-http://localhost}
      - PORT=3001
      - DB_NAME=${DB_NAME:-bym}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-dev12345}
      - SECRET_KEY=${SECRET_KEY:-secret}
      - REDIS_URL=redis://redis:6379
      - CDN_URL=${CDN_URL:-}
      - USE_VERSION_MANAGEMENT=${USE_VERSION_MANAGEMENT:-}
      - CHAT_WS_PORT=${CHAT_WS_PORT:-3010}
      - CHAT_WS_HOST=${CHAT_WS_HOST:-localhost:3010}
    networks:
      - bymr
    volumes:
      # Outpost kits made with src/scripts/export-kits.ts. Bound to the host folder so they are
      # written straight to disk and survive image rebuilds and container re-creation.
      - ./public/assets/kits:/app/public/assets/kits
      # The published game client (served at /<name>.swf). Bound so a new build is a file copy.
      - ./public/client:/app/public/client
      # The published browser client (publish-web.cmd -> /web/) and the watch-mode build (/web-dev/).
      # Bound for the same reason: publishing is a file copy, no image rebuild.
      - ./public/web:/app/public/web
      - ./public/web-dev:/app/public/web-dev
      # (14 October, QoL #264: the server's log file, kept on the host: a rebuild used to lose it)
      - ./logs:/app/logs
      # (15 October, QoL #270: the backups folder, read only: the admin panel shows the newest backup and a failure)
      - ${BACKUP_DIR:-./backups}:/app/backups:ro
    # (and Docker's own copy of the console output, rotated: 10 files of 20 MB)
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"
    ports:
      - ${API_PORT:-3001}:3001
      - ${CHAT_WS_PORT:-3010}:3010
      - 843:843
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '4.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  # Database
  db:
    image: postgres:18.1
    container_name: bymr-database
    # (back after Docker restarts, like the server: a stopped database stops the backups too)
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-bym}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-dev12345}
    # (14 October, QoL #263: only this computer can reach the database; the server reaches it inside Docker)
    ports:
      - 127.0.0.1:${DB_HOST_PORT:-5432}:5432
    networks:
      - bymr
    volumes:
      - db:/var/lib/postgresql
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-bym}"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  # Automatic database backups (docker/db-backup.sh): every day at BACKUP_HOUR (TZ), or as soon as it
  # runs when the newest backup is more than a day old, into BACKUP_DIR (default: this folder's
  # "backups"). Keeps BACKUP_KEEP_DAYS days, then one a week for BACKUP_KEEP_WEEKS weeks, then one a
  # month for BACKUP_KEEP_MONTHS months. backup-db.cmd backs up now, restore-db.cmd puts one back.
  backup:
    image: postgres:18.1
    container_name: bymr-backup
    restart: unless-stopped
    environment:
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=${DB_USER:-postgres}
      - PGPASSWORD=${DB_PASSWORD:-dev12345}
      - PGDATABASE=${DB_NAME:-bym}
      - TZ=${TZ:-America/Chicago}
      - BACKUP_HOUR=${BACKUP_HOUR:-4}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-14}
      - BACKUP_KEEP_WEEKS=${BACKUP_KEEP_WEEKS:-8}
      - BACKUP_KEEP_MONTHS=${BACKUP_KEEP_MONTHS:-12}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./docker/db-backup.sh:/scripts/db-backup.sh:ro
    networks:
      - bymr
    # (Windows line endings taken out first, in case git or an editor put them in)
    entrypoint: ["sh", "-c", "tr -d '\\r' < /scripts/db-backup.sh > /usr/local/bin/db-backup && chmod +x /usr/local/bin/db-backup && exec db-backup loop"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    depends_on:
      db:
        condition: service_healthy

  # pgAdmin — database GUI (optional, start with: docker compose --profile tools up)
  pgadmin:
    image: dpage/pgadmin4:9.4
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@admin.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - ${PGADMIN_PORT:-8080}:80
    networks:
      - bymr
    volumes:
      - pgadmin:/var/lib/pgadmin
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    depends_on:
      - db
    profiles:
      - tools

  # Redis
  redis:
    image: redis:8.10.1
    container_name: bymr-redis-cache
    # (QoL #272: an append-only file on its own volume; 100 MB at most, the least used keys go first)
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "100mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis:/data
    # (QoL #263: Redis has no password, so only this computer can reach it)
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    networks:
      - bymr
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
