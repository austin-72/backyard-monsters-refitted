<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BYM Refitted">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <title>Backyard Monsters Refitted</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; overflow: hidden; color: #ccc; font: 14px system-ui, sans-serif;
      overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
    #game { position: fixed; inset: 0; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script>
    // Loads the current build: version.json names the content-hashed bundle (see tools/build.ts).
    fetch("version.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (v) {
        window.__BYMR_VERSION = v.id;
        var s = document.createElement("script");
        s.type = "module";
        s.src = v.script;
        document.body.appendChild(s);
        // ?watch=1 (development, tools/watch.ts): reload when a new build is published
        if (/[?&]watch=1(&|$)/.test(location.search)) {
          setInterval(function () {
            fetch("version.json?t=" + Date.now(), { cache: "no-store" })
              .then(function (r) { return r.json(); })
              .then(function (n) { if (n.id !== v.id) location.reload(); })
              .catch(function () {});
          }, 2000);
        }
      })
      .catch(function () { document.getElementById("game").textContent = "The game could not be loaded. Please reload the page."; });
  </script>
</body>
</html>
